<div class="min-h-screen bg-gradient-to-br from-slate-900 via-slate-800 to-blue-950 flex items-center justify-center p-4">
  <div class="max-w-md w-full">
    
    <!-- Tarjeta Principal de Login -->
    <div class="bg-white rounded-2xl shadow-2xl overflow-hidden border border-slate-100">
      
      <!-- Header con Logo -->
      <div class="bg-gradient-to-r from-blue-700 to-indigo-800 p-8 text-white text-center">
        <div class="w-16 h-16 bg-white/10 backdrop-blur-md rounded-2xl flex items-center justify-center mx-auto mb-4 border border-white/20 shadow-inner">
          <span class="text-3xl">📦</span>
        </div>
        <h2 class="text-2xl font-bold tracking-tight">Sistema de Inventario</h2>
        <p class="text-blue-100 text-sm mt-1">Ingresa tus credenciales para acceder</p>
      </div>

      <!-- Formulario -->
      <div class="p-8">
        
        <!-- Alerta de Error -->
        <div *ngIf="errorMensaje()" class="mb-5 p-3.5 bg-rose-50 border border-rose-200 text-rose-700 rounded-xl text-sm flex items-center gap-2">
          <span>⚠️</span>
          <span>{{ errorMensaje() }}</span>
        </div>

        <form (ngSubmit)="onSubmit()" class="space-y-5">
          
          <!-- Campo Usuario / Email -->
          <div>
            <label class="block text-xs font-semibold text-slate-700 uppercase tracking-wider mb-2">
              Usuario o Correo Electrónico
            </label>
            <div class="relative">
              <span class="absolute inset-y-0 left-0 pl-3.5 flex items-center text-slate-400">👤</span>
              <input 
                type="text" 
                [(ngModel)]="usuario" 
                name="usuario" 
                placeholder="ej: admin o operador1"
                required
                class="w-full pl-10 pr-4 py-2.5 rounded-xl border border-slate-300 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent text-sm bg-slate-50/50 hover:bg-white transition-all"/>
            </div>
          </div>

          <!-- Campo Contraseña -->
          <div>
            <label class="block text-xs font-semibold text-slate-700 uppercase tracking-wider mb-2">
              Contraseña
            </label>
            <div class="relative">
              <span class="absolute inset-y-0 left-0 pl-3.5 flex items-center text-slate-400">🔒</span>
              <input 
                [type]="mostrarContrasena() ? 'text' : 'password'" 
                [(ngModel)]="contrasena" 
                name="contrasena" 
                placeholder="••••••••"
                required
                class="w-full pl-10 pr-12 py-2.5 rounded-xl border border-slate-300 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent text-sm bg-slate-50/50 hover:bg-white transition-all"/>
              <button 
                type="button" 
                (click)="toggleMostrarContrasena()"
                class="absolute inset-y-0 right-0 pr-3.5 flex items-center text-xs text-slate-400 hover:text-slate-700">
                {{ mostrarContrasena() ? 'Ocultar' : 'Ver' }}
              </button>
            </div>
          </div>

          <!-- Botón de Envío -->
          <button 
            type="submit" 
            [disabled]="cargando()"
            class="w-full py-3 px-4 bg-blue-600 hover:bg-blue-700 text-white font-semibold rounded-xl shadow-lg shadow-blue-600/30 transition-all flex items-center justify-center gap-2 disabled:opacity-50 disabled:cursor-not-allowed">
            <span *ngIf="cargando()" class="inline-block animate-spin">⏳</span>
            <span>{{ cargando() ? 'Iniciando sesión...' : 'Iniciar Sesión' }}</span>
          </button>
        </form>

        <!-- Accesos rápidos para prueba -->
        <div class="mt-8 pt-6 border-t border-slate-100 text-center">
          <p class="text-xs text-slate-500 font-medium mb-3">Usuarios de prueba rápidos (Contraseña: Admin123*):</p>
          <div class="flex gap-2 justify-center">
            <button 
              type="button" 
              (click)="fillCredentials('admin')" 
              class="px-3 py-1.5 rounded-lg text-xs font-medium bg-blue-50 text-blue-700 border border-blue-200 hover:bg-blue-100 transition-colors">
              🛡️ Admin
            </button>
            <button 
              type="button" 
              (click)="fillCredentials('operador1')" 
              class="px-3 py-1.5 rounded-lg text-xs font-medium bg-slate-100 text-slate-700 border border-slate-200 hover:bg-slate-200 transition-colors">
              👷 Operador
            </button>
          </div>
        </div>

      </div>
    </div>

    <!-- Footer Copyright -->
    <p class="text-center text-xs text-slate-400 mt-6">
      Challenge Full Stack .NET Core & Angular • © 2026
    </p>

  </div>
</div>
