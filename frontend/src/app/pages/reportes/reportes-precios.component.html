<div class="space-y-6">
  
  <!-- Encabezado de la Vista -->
  <div class="flex flex-col sm:flex-row sm:items-center sm:justify-between gap-4 bg-brand-primary p-6 rounded-2xl shadow-md text-white">
    <div>
      <h1 class="text-xl sm:text-2xl font-extrabold text-white tracking-tight">Matriz Comparativa de Precios</h1>
      <p class="text-xs sm:text-sm text-pink-100 mt-1">
        Consulta de precios de venta de cada producto según el proveedor o lote correspondiente.
      </p>
    </div>
  </div>

  <!-- Barra de Filtros -->
  <div class="bg-white p-4 rounded-2xl border border-slate-200/80 shadow-xs flex flex-col sm:flex-row gap-3 items-center justify-between">
    <div class="relative w-full sm:w-96">
      <span class="absolute inset-y-0 left-0 pl-3.5 flex items-center text-slate-400">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/>
        </svg>
      </span>
      <input 
        type="text" 
        [(ngModel)]="filtro" 
        (keyup.enter)="buscar()"
        placeholder="Filtrar por nombre del producto..."
        class="w-full pl-10 pr-4 py-2 rounded-xl border border-slate-300 focus:outline-none focus:ring-2 focus:ring-brand-primary text-sm bg-slate-50/50 hover:bg-white transition-all"/>
    </div>
    <div class="flex items-center gap-2">
      <button (click)="buscar()" class="px-4 py-2 bg-slate-900 hover:bg-black text-white rounded-xl text-sm font-semibold transition-colors">
        Buscar
      </button>
    </div>
  </div>

  <!-- Tabla Genérica de Matriz Comparativa con Patrón Zebra -->
  <app-table
    [columns]="columnas"
    [data]="reporte()"
    [loading]="cargando()"
    [zebra]="true"
    [showPagination]="false"
    emptyMessage="No hay productos ni proveedores para mostrar en la matriz.">
  </app-table>

  <!-- Template para Celdas de Precios por Proveedor -->
  <ng-template #precioTpl let-item let-value="value">
    <ng-container *ngIf="value > 0; else noData">
      <span class="font-mono font-bold text-slate-900 bg-brand-primary-light text-brand-primary px-3 py-1 rounded-lg border border-brand-primary-muted/30 text-sm inline-block">
        ${{ value | number:'1.2-2' }}
      </span>
    </ng-container>
    <ng-template #noData>
      <span class="text-xs text-slate-400 italic">No disponible</span>
    </ng-template>
  </ng-template>

</div>
