<div class="space-y-6">
  
  <div class="flex flex-col sm:flex-row sm:items-center sm:justify-between gap-4 bg-white p-6 rounded-2xl border border-slate-200/80 shadow-xs">
    <div>
      <h1 class="text-xl sm:text-2xl font-extrabold text-slate-800 tracking-tight">Gestión de Proveedores</h1>
      <p class="text-xs sm:text-sm text-slate-500 mt-1">
        Administración de empresas suministradoras y datos de contacto.
      </p>
    </div>
    <div *ngIf="authService.isAdmin()">
      <button 
        (click)="abrirModalCrear()"
        class="inline-flex items-center gap-2 px-4 py-2.5 bg-brand-primary hover:bg-brand-primary-hover text-white text-sm font-bold rounded-xl shadow-md transition-all">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"/>
        </svg>
        <span>Nuevo Proveedor</span>
      </button>
    </div>
  </div>

  <!-- Barra de Filtros -->
  <div class="bg-white p-4 rounded-2xl border border-slate-200/80 shadow-xs flex flex-col sm:flex-row gap-3 items-center justify-between">
    <div class="relative w-full sm:w-80">
      <span class="absolute inset-y-0 left-0 pl-3.5 flex items-center text-slate-400">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/>
        </svg>
      </span>
      <input 
        type="text" 
        [(ngModel)]="filtro" 
        (keyup.enter)="buscar()"
        placeholder="Buscar por nombre o correo..."
        class="w-full pl-10 pr-4 py-2 rounded-xl border border-slate-300 focus:outline-none focus:ring-2 focus:ring-brand-primary text-sm bg-slate-50/50 hover:bg-white transition-all"/>
    </div>
    <div class="flex items-center gap-2">
      <button (click)="buscar()" class="px-4 py-2 bg-slate-900 hover:bg-black text-white rounded-xl text-sm font-semibold transition-colors">
        Buscar
      </button>
    </div>
  </div>

  <!-- Tabla Genérica de Proveedores -->
  <app-table
    [columns]="columnas"
    [data]="proveedores()"
    [loading]="cargando()"
    [zebra]="true"
    [showPagination]="true"
    [currentPage]="paginaActual"
    [totalPages]="totalPaginas()"
    [totalRecords]="totalRegistros()"
    (pageChange)="cambiarPagina($event)"
    emptyMessage="No se encontraron proveedores registrados.">
  </app-table>

  <!-- Templates Personalizados para Celdas de Proveedores -->
  <ng-template #idTpl let-item>
    <span class="font-mono font-bold text-brand-primary">#{{ item.id }}</span>
  </ng-template>

  <ng-template #estadoTpl let-item>
    <span 
      [ngClass]="item.estado ? 'bg-emerald-50 text-emerald-700 border-emerald-200' : 'bg-rose-50 text-rose-700 border-rose-200'"
      class="text-xs font-bold px-2.5 py-1 rounded-full border inline-block">
      {{ item.estado ? 'Activo' : 'Inactivo' }}
    </span>
  </ng-template>

  <ng-template #accionesTpl let-item>
    <div class="flex items-center justify-center gap-2">
      <button (click)="abrirModalEditar(item)" title="Editar" class="p-1.5 text-brand-primary hover:bg-brand-primary-light rounded-lg">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z"/>
        </svg>
      </button>
      <button (click)="eliminar(item)" title="Eliminar" class="p-1.5 text-rose-600 hover:bg-rose-50 rounded-lg">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"/>
        </svg>
      </button>
    </div>
  </ng-template>

  <!-- Modal Genérico: Crear Proveedor -->
  <app-modal
    [isOpen]="mostrarModalCrear()"
    (close)="mostrarModalCrear.set(false)"
    title="Nuevo Proveedor"
    subtitle="Ingrese la información corporativa y de contacto de la empresa"
    size="md">

    <form (ngSubmit)="guardarCrear()" class="space-y-4 text-sm">
      <div>
        <label class="block text-xs font-bold text-slate-700 mb-1">Nombre / Razón Social *</label>
        <input type="text" [(ngModel)]="formCrear.nombre" name="nombre" placeholder="ej: Proveedor Z" required class="w-full px-3 py-2 rounded-xl border border-slate-300 focus:ring-2 focus:ring-brand-primary"/>
      </div>
      <div>
        <label class="block text-xs font-bold text-slate-700 mb-1">Correo Electrónico *</label>
        <input type="email" [(ngModel)]="formCrear.email" name="email" placeholder="ventas@proveedorz.com" required class="w-full px-3 py-2 rounded-xl border border-slate-300 focus:ring-2 focus:ring-brand-primary"/>
      </div>
      <div>
        <label class="block text-xs font-bold text-slate-700 mb-1">Celular / Teléfono</label>
        <input type="text" [(ngModel)]="formCrear.celular" name="celular" maxlength="10" placeholder="0991234567" class="w-full px-3 py-2 rounded-xl border border-slate-300 focus:ring-2 focus:ring-brand-primary"/>
      </div>

      <div class="flex justify-end gap-3 pt-4 border-t border-slate-100">
        <button type="button" (click)="mostrarModalCrear.set(false)" class="px-4 py-2 rounded-xl border border-slate-300 text-slate-700 hover:bg-slate-50 font-medium">Cancelar</button>
        <button type="submit" [disabled]="guardando()" class="px-5 py-2 rounded-xl bg-brand-primary hover:bg-brand-primary-hover text-white font-bold disabled:opacity-50 shadow-md">
          {{ guardando() ? 'Guardando...' : 'Crear Proveedor' }}
        </button>
      </div>
    </form>
  </app-modal>

  <!-- Modal Genérico: Editar Proveedor -->
  <app-modal
    [isOpen]="mostrarModalEditar()"
    (close)="mostrarModalEditar.set(false)"
    title="Editar Proveedor"
    subtitle="Actualice los datos o el estado de operación de la empresa"
    size="md">

    <form (ngSubmit)="guardarEditar()" class="space-y-4 text-sm">
      <div>
        <label class="block text-xs font-bold text-slate-700 mb-1">Nombre / Razón Social *</label>
        <input type="text" [(ngModel)]="formEditar.nombre" name="nombre" required class="w-full px-3 py-2 rounded-xl border border-slate-300 focus:ring-2 focus:ring-brand-primary"/>
      </div>
      <div>
        <label class="block text-xs font-bold text-slate-700 mb-1">Correo Electrónico *</label>
        <input type="email" [(ngModel)]="formEditar.email" name="email" required class="w-full px-3 py-2 rounded-xl border border-slate-300 focus:ring-2 focus:ring-brand-primary"/>
      </div>
      <div>
        <label class="block text-xs font-bold text-slate-700 mb-1">Celular / Teléfono</label>
        <input type="text" [(ngModel)]="formEditar.celular" name="celular" maxlength="10" class="w-full px-3 py-2 rounded-xl border border-slate-300 focus:ring-2 focus:ring-brand-primary"/>
      </div>
      <div class="flex items-center gap-2">
        <input type="checkbox" id="estadoProv" [(ngModel)]="formEditar.estado" name="estado" class="w-4 h-4 text-brand-primary rounded"/>
        <label for="estadoProv" class="text-xs font-bold text-slate-700">Proveedor Activo</label>
      </div>

      <div class="flex justify-end gap-3 pt-4 border-t border-slate-100">
        <button type="button" (click)="mostrarModalEditar.set(false)" class="px-4 py-2 rounded-xl border border-slate-300 text-slate-700 hover:bg-slate-50 font-medium">Cancelar</button>
        <button type="submit" [disabled]="guardando()" class="px-5 py-2 rounded-xl bg-brand-primary hover:bg-brand-primary-hover text-white font-bold disabled:opacity-50 shadow-md">
          {{ guardando() ? 'Guardando...' : 'Actualizar' }}
        </button>
      </div>
    </form>
  </app-modal>

</div>
