services:
  # ============================================================================
  # 1. SERVICIO DE BASE DE DATOS: Microsoft SQL Server 2022 Linux
  # ============================================================================
  sql-server:
    build:
      context: ./Database
      dockerfile: Dockerfile
    container_name: inventario_sqlserver
    restart: unless-stopped
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "${DB_PASSWORD:-YourStrongPassword123!}"
      MSSQL_PID: "Developer"
    ports:
      - "${DB_PORT:-1433}:1433"
    volumes:
      - sqlserver_data:/var/opt/mssql
    networks:
      - inventario_net
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$${MSSQL_SA_PASSWORD}\" -C -Q \"SELECT 1\" 2>/dev/null || /opt/mssql-tools/bin/sqlcmd -S localhost -U sa -P \"$${MSSQL_SA_PASSWORD}\" -C -Q \"SELECT 1\" 2>/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  # ============================================================================
  # 2. SERVICIO BACKEND: .NET 8 Web API
  # ============================================================================
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: inventario_backend
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: "Production"
      ASPNETCORE_URLS: "http://+:5000"
      ConnectionStrings__DefaultConnection: "Server=sql-server,1433;Database=Prueba;User Id=sa;Password=${DB_PASSWORD:-YourStrongPassword123!};TrustServerCertificate=True;MultipleActiveResultSets=true;"
      Jwt__Key: "${JWT_KEY:-InventarioApp_JWT_Secret_Key_SuperSecure_2026_Key_MustBe32BytesLong!}"
      Jwt__Issuer: "${JWT_ISSUER:-InventoryApi}"
      Jwt__Audience: "${JWT_AUDIENCE:-InventoryAngularClient}"
      Jwt__ExpiresInMinutes: "120"
    ports:
      - "${BACKEND_PORT:-5000}:5000"
    volumes:
      - backend_logs:/app/logs
    depends_on:
      sql-server:
        condition: service_healthy
    networks:
      - inventario_net

  # ============================================================================
  # 3. SERVICIO FRONTEND: Angular 18 con Nginx (SPA + Reverse Proxy)
  # ============================================================================
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: inventario_frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-80}:80"
      - "${FRONTEND_DEV_PORT:-4200}:80"
    depends_on:
      backend:
        condition: service_started
    networks:
      - inventario_net

# ============================================================================
# VOLÚMENES PERSISTENTES
# ============================================================================
volumes:
  sqlserver_data:
    name: inventario_sqlserver_data
  backend_logs:
    name: inventario_backend_logs

# ============================================================================
# RED PRIVADA DE CONTENEDORES
# ============================================================================
networks:
  inventario_net:
    name: inventario_network
    driver: bridge
